<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-style-control demo</title>
    <style>
      body {
        margin: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* #map .maplibre-style-control {
        --style-control-radius: 4px;
        --style-control-color-accent: #28ad58;
        --style-control-color-primary: #0074d9;
      } */
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map, config } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import maplibreWorkerUrl from "maplibre-gl/dist/maplibre-gl-worker.mjs?url";
      import { StyleControl } from "../src/index.ts";

      // maplibre-gl derives its worker URL from its own import.meta.url, which
      // only works when it's served as its own file. Since the demo build
      // bundles it into one chunk, that derived URL 404s and the worker hangs
      // forever - point it at the worker file explicitly instead.
      config.WORKER_URL = maplibreWorkerUrl;

      const map = new Map({
        container: "map",
        style: "https://styles.maptoolkit.org/summer.json",
        center: { lng: 11.40037, lat: 47.26816 },
        zoom: 12,
      });

      const ctrl = new StyleControl();
      ctrl.on("style.set", (ev) => console.log(ev));
      map.addControl(ctrl);
    </script>
  </body>
</html>
